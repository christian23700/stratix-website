<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="size" content="1600x1000" />
<link rel="stylesheet" href="base.css" />
<style>
  .scene { background: linear-gradient(180deg, #7cc2ea 0%, #bfe1f2 38%, #fbe3bd 70%, #f6c98d 100%); }
  .stars { color: #f5a623; display: inline-flex; gap: 2px; }
  .tl { display: flex; gap: 16px; align-items: flex-start; }
  .tl .d { width: 14px; height: 14px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="scene">
  <div class="abs" style="left:1180px;top:90px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#fff6dc 0%,#ffd98a 60%,rgba(255,217,138,0) 72%)"></div>
  <div class="abs skyline" style="left:200px;bottom:250px;width:1200px;height:300px;background:#8aa9c4;opacity:.75"></div>
  <!-- dunes -->
  <svg class="abs" style="left:0;bottom:0" width="1600" height="420" viewBox="0 0 1600 420" preserveAspectRatio="none">
    <path d="M0 170 C 260 80, 520 120, 760 190 S 1260 110, 1600 150 V420 H0Z" fill="#efc183"/>
    <path d="M0 260 C 300 190, 600 230, 900 280 S 1400 220, 1600 250 V420 H0Z" fill="#e3a964"/>
    <path d="M0 340 C 400 290, 800 330, 1100 360 S 1450 330, 1600 340 V420 H0Z" fill="#d18f4c"/>
  </svg>

  <!-- Hotel -->
  <div class="abs card" style="left:120px;top:150px;width:420px;padding:0;overflow:hidden">
    <div style="height:170px;background:linear-gradient(135deg,#0b2d6b,#1593d0);position:relative">
      <div class="abs skyline" style="left:0;bottom:0;width:420px;height:120px;background:#061430;opacity:.8"></div>
      <span class="chip abs" style="left:16px;top:16px;background:#fff;color:var(--ink)"><i data-icon="bed" data-size="18"></i> Hotel</span>
    </div>
    <div style="padding:20px 24px">
      <div class="h">Downtown Dubai</div>
      <div class="row" style="justify-content:space-between;margin-top:8px">
        <span class="stars"><i data-icon="star" data-size="20"></i><i data-icon="star" data-size="20"></i><i data-icon="star" data-size="20"></i><i data-icon="star" data-size="20"></i><i data-icon="star" data-size="20"></i></span>
        <span class="label">3 nights</span></div>
    </div>
  </div>

  <!-- Itinerary -->
  <div class="abs card" style="left:600px;top:220px;width:430px">
    <div class="row" style="justify-content:space-between"><div class="h">Your trip</div><span class="chip" style="background:var(--blue-tint);color:var(--blue-strong)">5 days</span></div>
    <div class="col" style="gap:18px;margin-top:22px">
      <div class="tl"><span class="d" style="background:var(--blue)"></span><div><b style="font-size:20px">Arrival · DXB</b><div class="label">Airport transfer</div></div></div>
      <div class="tl"><span class="d" style="background:var(--gold)"></span><div><b style="font-size:20px">Desert safari</b><div class="label">Dune bashing · dinner</div></div></div>
      <div class="tl"><span class="d" style="background:var(--green)"></span><div><b style="font-size:20px">City tour</b><div class="label">Burj Khalifa · Marina</div></div></div>
      <div class="tl"><span class="d" style="background:#c792ea"></span><div><b style="font-size:20px">Shopping day</b><div class="label">Malls · Gold Souk</div></div></div>
    </div>
  </div>

  <!-- Visa -->
  <div class="abs card" style="left:1090px;top:330px;width:380px;padding:22px">
    <div class="row"><span class="ico" style="width:54px;height:54px;background:#e8f7ef;color:var(--green)"><i data-icon="doc"></i></span>
      <div><div class="h" style="font-size:22px">Tourist visa</div><div class="label">Licensed agency</div></div></div>
    <div class="row" style="margin-top:16px;justify-content:space-between"><span class="label">Status</span><span class="chip" style="background:#e8f7ef;color:var(--green)"><i data-icon="check" data-size="16" data-stroke="2.6"></i> Approved</span></div>
  </div>

  <div class="abs pill" style="left:1150px;top:540px"><i data-icon="car" style="color:var(--blue)"></i> Airport pickup</div>
  <div class="abs pill" style="left:240px;top:560px"><i data-icon="users" style="color:var(--gold)"></i> Families &amp; groups</div>
</div>
<script src="base.js"></script>
</body>
</html>
