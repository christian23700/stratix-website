<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="size" content="1600x1000" />
<link rel="stylesheet" href="base.css" />
<style>
  .scene { background: linear-gradient(180deg, #0b2d6b 0%, #1593d0 45%, #f3c68e 82%, #f7dcb2 100%); }
  .sun { position: absolute; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, #fff3d6 0%, #f8d38f 55%, rgba(248,211,143,0) 72%); }
  .pass { display: flex; background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(6,20,48,.55); }
  .pass .main { padding: 30px 34px; flex: 1; }
  .pass .stub { width: 170px; border-left: 3px dashed #d7dde6; padding: 30px 22px; background: #f6f8fb; display: flex; flex-direction: column; justify-content: space-between; }
  .code3 { font-size: 64px; font-weight: 800; letter-spacing: .02em; line-height: 1; }
  .aud { width: 230px; padding: 22px; border-radius: 20px; background: #fff; box-shadow: 0 24px 50px -24px rgba(6,20,48,.5); }
</style>
</head>
<body>
<div class="scene">
  <div class="sun" style="left:1150px;top:420px"></div>
  <!-- trail + plane -->
  <svg class="abs" style="left:0;top:0" width="1600" height="1000"><path d="M-40 360 C 300 240, 700 120, 1240 150" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/></svg>
  <div class="abs" style="left:1230px;top:95px;color:#fff;transform:rotate(-6deg)"><i data-icon="plane" data-size="96" data-stroke="1.4"></i></div>
  <!-- skyline -->
  <div class="abs skyline" style="left:0;bottom:0;width:1600px;height:400px;background:#0b1f42;opacity:.92"></div>

  <!-- Boarding pass -->
  <div class="abs pass" style="left:300px;top:250px;width:760px">
    <div class="main">
      <div class="row" style="justify-content:space-between">
        <img src="assets/stratix-mark.png" style="width:46px;height:46px" />
        <span class="chip" style="background:var(--blue-tint);color:var(--blue-strong)">Boarding pass</span>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:26px">
        <div><div class="code3">DLA</div><div class="label">Douala</div></div>
        <div style="flex:1;margin:0 26px;border-top:3px dotted #c5ced9;position:relative;top:-14px"><span style="position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:#fff;padding:0 8px;color:var(--blue)"><i data-icon="plane" data-size="34"></i></span></div>
        <div style="text-align:right"><div class="code3">DXB</div><div class="label">Dubai</div></div>
      </div>
      <div class="row" style="gap:40px;margin-top:28px">
        <div><div class="label">Visa</div><div class="h" style="color:var(--green)">Approved</div></div>
        <div><div class="label">Hotel</div><div class="h">Booked</div></div>
        <div><div class="label">Transfer</div><div class="h">Ready</div></div>
      </div>
    </div>
    <div class="stub">
      <div><div class="label">Seat</div><div class="h" style="font-size:34px">14A</div></div>
      <svg width="120" height="56" viewBox="0 0 120 56"><g fill="#0b1f42"><rect x="0" width="4" height="56"/><rect x="8" width="2" height="56"/><rect x="14" width="6" height="56"/><rect x="24" width="2" height="56"/><rect x="30" width="4" height="56"/><rect x="38" width="2" height="56"/><rect x="44" width="8" height="56"/><rect x="56" width="2" height="56"/><rect x="62" width="4" height="56"/><rect x="70" width="6" height="56"/><rect x="80" width="2" height="56"/><rect x="86" width="4" height="56"/><rect x="94" width="2" height="56"/><rect x="100" width="6" height="56"/><rect x="110" width="2" height="56"/><rect x="116" width="4" height="56"/></g></svg>
    </div>
  </div>

  <!-- Audience cards -->
  <div class="abs aud" style="left:180px;top:600px"><span class="ico" style="width:54px;height:54px;background:var(--blue-tint);color:var(--blue)"><i data-icon="plane"></i></span><div class="h" style="margin-top:14px">Tourists</div><div class="label">Visa · hotels · tours</div></div>
  <div class="abs aud" style="left:440px;top:640px"><span class="ico" style="width:54px;height:54px;background:var(--gold-tint);color:var(--gold)"><i data-icon="briefcase"></i></span><div class="h" style="margin-top:14px">Businesses</div><div class="label">Setup · sourcing · fairs</div></div>
  <div class="abs aud" style="left:700px;top:600px"><span class="ico" style="width:54px;height:54px;background:#e8f7ef;color:var(--green)"><i data-icon="graduation"></i></span><div class="h" style="margin-top:14px">Students</div><div class="label">Admission · housing</div></div>

  <div class="abs card" style="left:1120px;top:300px;width:330px;padding:20px 22px">
    <div class="row"><span class="ico" style="width:50px;height:50px;border-radius:50%;background:#e8f7ef;color:var(--green)"><i data-icon="check" data-stroke="2.6"></i></span>
      <div><div class="h" style="font-size:22px">Provider matched</div><div class="label">Licensed · vetted</div></div></div>
  </div>
</div>
<script src="base.js"></script>
</body>
</html>
