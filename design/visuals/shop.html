<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="size" content="1600x1000" />
<link rel="stylesheet" href="base.css" />
<style>
  .scene { background: linear-gradient(150deg, #faf2e1 0%, #faf8f4 55%, #e4f3fb 100%); }
  .prod { border-radius: 16px; border: 1px solid #eef1f5; overflow: hidden; }
  .prod .img { height: 170px; display: flex; align-items: center; justify-content: center; }
  .prod .meta { padding: 14px 16px; }
  .price { font-weight: 800; font-size: 20px; }
  .line { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #eef1f5; font-size: 18px; font-weight: 600; }
  .mini { width: 52px; height: 52px; border-radius: 12px; }
</style>
</head>
<body>
<div class="scene">
  <div class="browser" style="left:110px;top:150px;width:980px;height:640px">
    <div class="top"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
      <span style="margin-left:18px;background:#fff;border-radius:8px;padding:5px 16px;font-size:15px;color:var(--muted);font-family:Inter">shop.your-brand.com</span></div>
    <div style="padding:28px 32px">
      <div class="row" style="justify-content:space-between"><div class="h" style="font-size:30px">New arrivals</div>
        <div class="row" style="gap:8px"><span class="chip" style="background:var(--ink);color:#fff">All</span><span class="chip" style="background:#eef1f5;color:var(--ink-soft)">Perfumes</span><span class="chip" style="background:#eef1f5;color:var(--ink-soft)">Cosmetics</span><span class="chip" style="background:#eef1f5;color:var(--ink-soft)">Fashion</span></div></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px">
        <div class="prod"><div class="img" style="background:linear-gradient(160deg,#f6e3c0,#e5b26a)"><svg width="70" height="110" viewBox="0 0 40 64"><rect x="13" y="0" width="14" height="12" rx="2" fill="#a77a30"/><rect x="2" y="14" width="36" height="50" rx="8" fill="#7a3d0e"/></svg></div><div class="meta"><div class="ln" style="width:70%"></div><div class="row" style="justify-content:space-between;margin-top:10px"><span class="price">$34</span><span class="ico" style="width:36px;height:36px;background:var(--ink);color:#fff;border-radius:10px"><i data-icon="cart" data-size="18"></i></span></div></div></div>
        <div class="prod"><div class="img" style="background:linear-gradient(160deg,#f7dbe5,#e08aa6)"><svg width="70" height="110" viewBox="0 0 40 64"><circle cx="20" cy="8" r="8" fill="#a77a30"/><path d="M20 16 L38 34 V60 Q38 64 34 64 H6 Q2 64 2 60 V34Z" fill="#6d2140"/></svg></div><div class="meta"><div class="ln" style="width:60%"></div><div class="row" style="justify-content:space-between;margin-top:10px"><span class="price">$28</span><span class="ico" style="width:36px;height:36px;background:var(--ink);color:#fff;border-radius:10px"><i data-icon="cart" data-size="18"></i></span></div></div></div>
        <div class="prod"><div class="img" style="background:linear-gradient(160deg,#e9e6f0,#9c97b0)"><svg width="80" height="130" viewBox="0 0 54 90"><path d="M27 8 V12 M8 22 L27 12 L46 22" stroke="#c99a3e" stroke-width="2" fill="none"/><path d="M14 22 H40 L52 40 L46 44 L42 34 L50 88 H4 L12 34 L8 44 L2 40Z" fill="#141018"/></svg></div><div class="meta"><div class="ln" style="width:75%"></div><div class="row" style="justify-content:space-between;margin-top:10px"><span class="price">$65</span><span class="ico" style="width:36px;height:36px;background:var(--ink);color:#fff;border-radius:10px"><i data-icon="cart" data-size="18"></i></span></div></div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px">
        <div class="prod" style="height:120px;background:linear-gradient(160deg,#e4f3fb,#bfe1f2)"></div>
        <div class="prod" style="height:120px;background:linear-gradient(160deg,#e8f7ef,#b9e6cf)"></div>
        <div class="prod" style="height:120px;background:linear-gradient(160deg,#faf2e1,#f0d7a4)"></div>
      </div>
    </div>
  </div>

  <div class="abs card" style="left:1130px;top:150px;width:370px">
    <div class="row" style="justify-content:space-between"><div class="h">Cart</div><span class="chip" style="background:var(--blue-tint);color:var(--blue-strong)">3 items</span></div>
    <div style="margin-top:8px">
      <div class="line"><span class="mini" style="background:linear-gradient(160deg,#f6e3c0,#e5b26a)"></span>Oud perfume<span style="margin-left:auto">$34</span></div>
      <div class="line"><span class="mini" style="background:linear-gradient(160deg,#f7dbe5,#e08aa6)"></span>Rose mist<span style="margin-left:auto">$28</span></div>
      <div class="line" style="border:0"><span class="mini" style="background:linear-gradient(160deg,#e9e6f0,#9c97b0)"></span>Abaya<span style="margin-left:auto">$65</span></div>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:10px"><span class="label">Total</span><span class="big" style="font-size:32px">$127</span></div>
  </div>

  <div class="abs card" style="left:1130px;top:600px;width:370px">
    <div class="label">Pay with</div>
    <div class="col" style="gap:10px;margin-top:12px">
      <div class="row" style="padding:12px 14px;border-radius:12px;border:2px solid var(--gold);font-weight:700;font-size:19px"><i data-icon="phone" style="color:var(--gold)"></i> Mobile Money</div>
      <div class="row" style="padding:12px 14px;border-radius:12px;border:1px solid #e4e8ee;font-weight:600;font-size:19px"><i data-icon="wallet" style="color:var(--blue)"></i> Card</div>
      <div class="row" style="padding:12px 14px;border-radius:12px;border:1px solid #e4e8ee;font-weight:600;font-size:19px"><i data-icon="chat" style="color:#25d366"></i> Order on WhatsApp</div>
    </div>
  </div>
</div>
<script src="base.js"></script>
</body>
</html>
