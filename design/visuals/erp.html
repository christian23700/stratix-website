<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="size" content="1600x1000" />
<link rel="stylesheet" href="base.css" />
<style>
  .scene { background: linear-gradient(150deg, #e4f3fb 0%, #faf8f4 100%); }
  .tile { border-radius: 18px; padding: 24px; color: #fff; }
  .tile .big { font-size: 38px; }
  table { width: 100%; border-collapse: collapse; font-size: 18px; }
  td { padding: 14px 6px; border-bottom: 1px solid #eef1f5; }
</style>
</head>
<body>
<div class="scene">
  <div class="browser" style="left:150px;top:180px;width:1300px;height:640px">
    <div class="top"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div style="display:flex;height:596px">
      <div style="width:230px;background:#0b1f42;padding:28px 22px;display:flex;flex-direction:column;gap:22px;color:rgba(255,255,255,.75);font-size:19px;font-weight:600">
        <img src="assets/stratix-mark.png" style="width:44px;filter:brightness(1.6)" />
        <div class="row" style="color:#fff"><i data-icon="chart"></i> Finance</div>
        <div class="row"><i data-icon="users"></i> HR</div>
        <div class="row"><i data-icon="truck"></i> Inventory</div>
        <div class="row"><i data-icon="cart"></i> Sales</div>
        <div class="row"><i data-icon="building"></i> Branches</div>
      </div>
      <div style="flex:1;padding:34px 38px;background:#fbfcfd">
        <div class="row" style="justify-content:space-between"><div class="h" style="font-size:32px">Company overview</div>
          <div class="row" style="gap:8px"><span class="chip" style="background:var(--blue-tint);color:var(--blue-strong)">Douala</span><span class="chip" style="background:var(--blue-tint);color:var(--blue-strong)">Dubai</span><span class="chip" style="background:#eef1f5;color:var(--muted)">+2</span></div></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:26px">
          <div class="tile" style="background:linear-gradient(135deg,#0b2d6b,#1593d0)"><i data-icon="wallet"></i><div class="big">$184k</div><div style="opacity:.8">Cash</div></div>
          <div class="tile" style="background:linear-gradient(135deg,#a77a30,#e8c77f)"><i data-icon="users"></i><div class="big">64</div><div style="opacity:.85">Staff</div></div>
          <div class="tile" style="background:linear-gradient(135deg,#1c7a52,#34c38f)"><i data-icon="truck"></i><div class="big">2,310</div><div style="opacity:.85">Stock items</div></div>
          <div class="tile" style="background:linear-gradient(135deg,#5b3fb0,#a48af0)"><i data-icon="cart"></i><div class="big">412</div><div style="opacity:.85">Orders</div></div>
        </div>
        <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:22px">
          <div class="card" style="box-shadow:0 0 0 1px #eef1f5">
            <div class="label">Approvals</div>
            <table>
              <tr><td><b>Purchase order</b></td><td class="label">Inventory</td><td style="text-align:right"><span class="chip" style="background:#e8f7ef;color:var(--green)">Approved</span></td></tr>
              <tr><td><b>Leave request</b></td><td class="label">HR</td><td style="text-align:right"><span class="chip" style="background:var(--gold-tint);color:#9a6f1f">Pending</span></td></tr>
              <tr><td><b>Invoice #881</b></td><td class="label">Finance</td><td style="text-align:right"><span class="chip" style="background:#e8f7ef;color:var(--green)">Paid</span></td></tr>
            </table>
          </div>
          <div class="card" style="box-shadow:0 0 0 1px #eef1f5;display:flex;align-items:center;gap:22px">
            <svg width="150" height="150" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="#eef1f5" stroke-width="6"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="#1593d0" stroke-width="6" stroke-dasharray="55 45" stroke-dashoffset="25"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="#c99a3e" stroke-width="6" stroke-dasharray="25 75" stroke-dashoffset="70"/></svg>
            <div class="col"><span class="row" style="gap:8px;font-weight:600"><span class="dot" style="background:#1593d0"></span>Sales</span><span class="row" style="gap:8px;font-weight:600"><span class="dot" style="background:#c99a3e"></span>Payroll</span><span class="row" style="gap:8px;font-weight:600"><span class="dot" style="background:#eef1f5"></span>Other</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="base.js"></script>
</body>
</html>
