<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="size" content="1600x1000" />
<link rel="stylesheet" href="base.css" />
<style>
  .scene { background: linear-gradient(150deg, #e8f7ef 0%, #faf8f4 60%, #faf2e1 100%); }
  .lesson { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; font-size: 19px; font-weight: 600; }
</style>
</head>
<body>
<div class="scene">
  <div class="browser" style="left:120px;top:120px;width:960px;height:700px">
    <div class="top"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div style="padding:28px">
      <div style="height:420px;border-radius:16px;background:linear-gradient(135deg,#0b2d6b,#1593d0);position:relative;overflow:hidden">
        <div class="abs skyline" style="left:0;bottom:0;width:904px;height:220px;background:#061430;opacity:.5"></div>
        <span class="abs" style="left:50%;top:50%;transform:translate(-50%,-50%);width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;color:var(--navy)"><i data-icon="play" data-size="46" data-stroke="2"></i></span>
        <div class="abs" style="left:24px;right:24px;bottom:22px;height:8px;border-radius:4px;background:rgba(255,255,255,.3)"><div style="width:42%;height:100%;border-radius:4px;background:#fff"></div></div>
      </div>
      <div class="h" style="font-size:30px;margin-top:22px">Lesson 4 · Selling online</div>
      <div class="col" style="gap:10px;margin-top:14px"><div class="ln" style="width:70%"></div><div class="ln" style="width:52%"></div></div>
    </div>
  </div>

  <div class="abs card" style="left:1120px;top:140px;width:380px">
    <div class="h">Lessons</div>
    <div class="col" style="gap:8px;margin-top:14px">
      <div class="lesson" style="background:#e8f7ef"><span style="color:var(--green)"><i data-icon="check" data-stroke="2.6"></i></span>Getting started</div>
      <div class="lesson" style="background:#e8f7ef"><span style="color:var(--green)"><i data-icon="check" data-stroke="2.6"></i></span>Your catalogue</div>
      <div class="lesson" style="background:#e8f7ef"><span style="color:var(--green)"><i data-icon="check" data-stroke="2.6"></i></span>Pricing</div>
      <div class="lesson" style="background:var(--blue-tint);color:var(--blue-strong)"><i data-icon="play"></i>Selling online</div>
      <div class="lesson" style="color:var(--muted)"><i data-icon="lock"></i>Final quiz</div>
    </div>
  </div>

  <div class="abs card" style="left:1150px;top:620px;width:350px">
    <div class="row" style="gap:20px">
      <svg width="110" height="110" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="#eef1f5" stroke-width="5"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="#22a06b" stroke-width="5" stroke-linecap="round" stroke-dasharray="72 28" stroke-dashoffset="25"/><text x="21" y="24" text-anchor="middle" font-size="9" font-weight="800" fill="#0b1f42" font-family="Bricolage Grotesque">72%</text></svg>
      <div><div class="h">Progress</div><div class="label">3 of 5 lessons</div></div>
    </div>
  </div>
  <div class="abs pill" style="left:220px;top:860px"><i data-icon="graduation" style="color:var(--green)"></i> Certificates</div>
  <div class="abs pill" style="left:480px;top:860px"><i data-icon="users" style="color:var(--blue)"></i> Cohorts</div>
  <div class="abs pill" style="left:700px;top:860px"><i data-icon="globe" style="color:var(--gold)"></i> EN · FR · AR</div>
</div>
<script src="base.js"></script>
</body>
</html>
