<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="size" content="1600x1000" />
<link rel="stylesheet" href="base.css" />
<style>
  /* E-Farmer theme: brown #5D4037, leaf #43A047 / #2E7D32, sun #F4B942, background #FFF8F6, Inter */
  body { font-family: "Inter", system-ui, sans-serif; color: #1E1B1A; }
  .scene { background: radial-gradient(70% 70% at 85% 20%, #E3F4E1 0%, transparent 60%), radial-gradient(60% 60% at 10% 90%, #fdecc8 0%, transparent 60%), #FFF8F6; }
  .laptop { position: absolute; }
  .laptop .lid { background: #2b2422; border-radius: 22px 22px 6px 6px; padding: 16px; box-shadow: 0 40px 80px -30px rgba(62,39,35,.55); }
  .laptop .lid img { display: block; width: 100%; border-radius: 8px; }
  .laptop .base { height: 22px; margin: 0 -50px; background: linear-gradient(#d9d3d0, #b5aca8); border-radius: 0 0 22px 22px; }
  .animal { width: 92px; height: 92px; border-radius: 24px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 30px -18px rgba(62,39,35,.45); }
  .animal img { width: 58px; height: 58px; }
  .tag { display: inline-flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 999px; font-size: 19px; font-weight: 600; background: #fff; box-shadow: 0 14px 26px -16px rgba(62,39,35,.45); }
</style>
</head>
<body>
<div class="scene">
  <!-- Copy -->
  <div class="abs" style="left:110px;top:120px;width:620px">
    <div class="row" style="gap:16px"><img src="assets/efarmer-logo.png" style="width:82px;height:82px;border-radius:20px" />
      <div><div style="font-size:46px;font-weight:700;color:#3E2723;letter-spacing:-.02em">E-Farmer</div><div style="font-size:15px;font-weight:600;letter-spacing:.18em;color:#43A047">SMART FARMING</div></div></div>
    <div style="margin-top:42px;font-size:70px;line-height:1.04;font-weight:700;letter-spacing:-.03em;color:#3E2723">Smart farming,<br/><span style="color:#2E7D32">brighter tomorrows.</span></div>
    <div style="margin-top:24px;font-size:23px;line-height:1.5;color:#5D4037;max-width:540px">Manage your animals, crops, team and money in one app.</div>
    <div class="row" style="gap:14px;margin-top:36px">
      <div class="animal"><img src="assets/efarmer-chicken.png" /></div>
      <div class="animal"><img src="assets/efarmer-cattle.png" /></div>
      <div class="animal"><img src="assets/efarmer-pig.png" /></div>
      <div class="animal"><img src="assets/efarmer-goat.png" /></div>
      <div class="animal"><img src="assets/efarmer-fish.png" /></div>
    </div>
    <div style="margin-top:40px;font-size:16px;color:#8d7d78;letter-spacing:.08em;text-transform:uppercase">by MboaSoft Solutions</div>
  </div>

  <!-- Laptop with real dashboard -->
  <div class="laptop" style="left:800px;top:190px;width:720px">
    <div class="lid"><img src="assets/efarmer-dashboard.png" /></div>
    <div class="base"></div>
  </div>

  <!-- Sora AI -->
  <div class="abs" style="left:760px;top:640px;width:400px;background:#fff;border-radius:22px;padding:20px 22px;box-shadow:0 30px 60px -24px rgba(62,39,35,.5)">
    <div class="row" style="gap:12px"><span class="ico" style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#2E7D32,#43A047);color:#fff"><i data-icon="bot" data-size="22"></i></span>
      <div><div style="font-weight:700;font-size:19px;color:#3E2723">Sora AI</div><div style="font-size:14px;color:#43A047">Farm assistant</div></div></div>
    <div style="margin-top:14px;background:#E3F4E1;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:16px;line-height:1.45;color:#1E1B1A">Egg production is up 6% this week. The vaccination for flock B is due on Friday.</div>
  </div>

  <div class="abs tag" style="left:1220px;top:690px"><span style="color:#5D4037"><i data-icon="wifiOff" data-size="20"></i></span>Works offline</div>
  <div class="abs tag" style="left:1220px;top:760px"><span style="color:#43A047"><i data-icon="globe" data-size="20"></i></span>iOS · Android · Windows</div>
  <div class="abs" style="left:1440px;top:40px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#ffe39b 0%,#F4B942 60%,rgba(244,185,66,0) 72%)"></div>
</div>
<script src="base.js"></script>
</body>
</html>
